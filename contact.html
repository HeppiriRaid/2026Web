<script>
  /* Same scale + zoom driver as the front page (kept in sync): --k is px per artboard
     point, fitted to the window's width but never letting the 16:9 screen
     (460.807 x 259.2 pt) grow taller than the window. A browser ZOOM (seen as a
     devicePixelRatio change) holds --k so the content scales instead of re-fitting. */
  (function () {
    var d = document.documentElement;
    var DW = 460.807, FIRST = 259.2, lastDPR = window.devicePixelRatio || 1;
    window.__fit = { dw: DW, clampPt: FIRST, narrow: false, k: 0 };
    // (a narrow screen: the page in one column, --k the size of its type — as index.html, css/narrow.css)
    function fitK() {
      var w = window.innerWidth, h = window.innerHeight;
      var narrow = w < 760 || (w < h && w < 1100) || (h < 520 && w < 1000);
      var k = narrow ? (h < 520 ? 3.6 : Math.max(3.6, Math.min(4.4, w / 104))) : Math.min(w / DW, h / FIRST);   // (a phone on its side: the smallest type)
      d.classList.toggle("narrow", narrow);
      window.__fit.narrow = narrow; window.__fit.k = k;
      d.style.setProperty("--k", k + "px");
    }
    fitK();
    window.addEventListener("resize", function () {
      var z = window.devicePixelRatio || 1;
      if (z !== lastDPR) { lastDPR = z; return; }
      fitK();
    });
    if (!window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      d.classList.add("anim");
      window.__revealFailsafe = setTimeout(function () {
        d.classList.remove("anim");
        var p = document.getElementById("preloader");
        if (p) p.style.display = "none";
      }, 5000);
    }
  })();

<script>
  /* Same scale + zoom driver as the front page (kept in sync): --k is px per
     artboard point. The page is one 16:9 artboard (460.807 x 259.2 pt), fitted by
     width AND height, so the composition always fits the window; a wide window
     centres it. Narrow / portrait windows switch to a phone layout (html.m) on a
     150pt-wide artboard (scale capped at 3.2px/pt for tablets), so the type stays legible. Across a browser ZOOM (seen as
     a devicePixelRatio change) --k is held, so the content scales like the front
     page rather than re-fitting. */
  (function () {
    var d = document.documentElement;
    var DW = 460.807, FIRST = 259.2, MW = 150, lastDPR = window.devicePixelRatio || 1;
    window.__fit = { dw: DW, clampPt: FIRST };
    function fitK() {
      var w = window.innerWidth, h = window.innerHeight;
      var m = w < 720 || w / h < 0.85;
      d.classList.toggle("m", m);
      d.style.setProperty("--k", (m ? Math.min(w / MW, 3.2) : Math.min(w / DW, h / FIRST)) + "px");
    }
    fitK();
    window.addEventListener("resize", function () {
      var z = window.devicePixelRatio || 1;
      if (z !== lastDPR) { lastDPR = z; return; }
      fitK();
    });
    if (!window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      d.classList.add("anim");
      window.__revealFailsafe = setTimeout(function () {
        d.classList.remove("anim");
        var p = document.getElementById("preloader");
        if (p) p.style.display = "none";
      }, 5000);
    }
  })();
</script>
